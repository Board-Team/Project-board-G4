<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ink & Pages Shop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Floating Book Background Decorative Elements -->
  <div class="floating-decorations" aria-hidden="true">
    <div class="floating-book float-1"><i class="fa-solid fa-book"></i></div>
    <div class="floating-book float-2"><i class="fa-solid fa-bookmark"></i></div>
    <div class="floating-book float-3"><i class="fa-solid fa-book-open"></i></div>
    <div class="floating-book float-4"><i class="fa-solid fa-feather"></i></div>
  </div>

  <!-- Main Container -->
  <main class="auth-container">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <header class="auth-header">
        <a href="index.html" class="logo">
          <i class="fa-solid fa-book-open-reader"></i>
          <span>Ink & Pages</span>
        </a>
        <h1>Welcome Back!</h1>
        <p class="subtitle">Please enter your details to sign in to your bookstore account.</p>
      </header>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>
            <input 
              type="email" 
              id="email" 
              name="email"
              class="form-control" 
              placeholder="name@example.com" 
              autocomplete="email"
              required
              aria-describedby="email-error"
            >
          </div>
          <span class="error-message" id="email-error" aria-live="polite"></span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
            <input 
              type="password" 
              id="password" 
              name="password"
              class="form-control password-input" 
              placeholder="••••••••" 
              autocomplete="current-password"
              required
              aria-describedby="password-error"
            >
            <button 
              type="button" 
              class="pass-toggle" 
              id="toggle-password" 
              aria-label="Show password" 
              title="Show password"
            >
              <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
          <span class="error-message" id="password-error" aria-live="polite"></span>
        </div>

        <!-- Auth Options -->
        <div class="auth-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <button type="button" class="forgot-link" id="open-forgot-modal">Forgot password?</button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
          <span class="btn-text">Sign In</span>
          <i class="fa-solid fa-spinner fa-spin spinner" id="submit-spinner" hidden></i>
        </button>
      </form>

      <!-- Social Divider -->
      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Social Login Buttons -->
      <div class="social-login">
        <button type="button" class="social-btn social-google" id="btn-google">
          <i class="fa-brands fa-google"></i> Google
        </button>
        <button type="button" class="social-btn social-facebook" id="btn-facebook">
          <i class="fa-brands fa-facebook-f"></i> Facebook
        </button>
      </div>

      <!-- Register Link -->
      <footer class="auth-footer">
        <p>Don't have an account? <a href="register.html" class="register-link">Create an account</a></p>
      </footer>

    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgot-modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button type="button" class="modal-close" id="close-forgot-modal" aria-label="Close modal">&times;</button>
      
      <div class="modal-header">
        <div class="modal-icon"><i class="fa-solid fa-key"></i></div>
        <h2 id="modal-title">Reset Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="reset-email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>
            <input 
              type="email" 
              id="reset-email" 
              class="form-control" 
              placeholder="name@example.com" 
              autocomplete="email"
              required
              aria-describedby="reset-email-error"
            >
          </div>
          <span class="error-message" id="reset-email-error" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn btn-primary modal-submit" id="reset-submit-btn">
          <span class="btn-text">Send Reset Link</span>
          <i class="fa-solid fa-spinner fa-spin spinner" id="reset-spinner" hidden></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- External Script -->
  <script src="js/script.js"></script>
</body>
</html>
